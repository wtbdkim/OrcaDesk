; Test-runner config. The suite covers the framework-free layers only
; (state/, core/, mlip/, config, paths, server API via TestClient) — the Qt
; bridge/window are exercised manually (they are thin adapters over the store;
; the logic under them is what these tests pin down).
;
;   python -m pytest                 # whole suite
;   node tests/web/scf_graph.test.js # JS tracker tests (no npm deps)
;
; Tests that read the real ORCA output corpus auto-skip when the corpus
; directory is absent, so the suite runs green on any machine.
[pytest]
testpaths = tests
addopts = -q
